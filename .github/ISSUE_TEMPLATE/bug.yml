name: Bug
description: Something that doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        This repository is public: please don't paste your own log, health data or server addresses.
        For a security problem, use Security → Report a vulnerability instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: "1. Open Today\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From /api/health ("version") or the release you deployed.
      placeholder: 1.9.0+abc1234
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone, Safari, installed on the home screen
