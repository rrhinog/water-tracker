# Dependency updates as pull requests, once a month: the "dependency day". Each one goes through
# CI and staging like any other change; nothing merges by itself. Minor and patch updates arrive
# grouped in one PR; a major version gets its own, since it can need code changes.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node the app runs on (node:22 in the Dockerfile), not the newest Node:
      # newer types would let code call APIs that don't exist at runtime. Move it by hand with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The workflows pin each action to a commit; this keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
