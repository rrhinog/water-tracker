# Runs on every pull request and on main: the same checks as the feature loop's "build + test" step.
# GitHub-hosted runner on purpose: this repo is public, and a self-hosted runner would let a
# fork's pull request run code on the maintainer's machine.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York # day rollover tests assume a local midnight that is not UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        # Route types (LayoutProps, PageProps) are generated, not committed; a fresh checkout needs them first.
        run: bunx next typegen && bunx tsc --noEmit
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
