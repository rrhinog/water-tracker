# Water Tracker — two containers from one image, each with its OWN database.
#
#   live     http://127.0.0.1:4210   (main branch)        -> LIVE_DATABASE_URL     (water_tracker)
#   staging  http://127.0.0.1:4211   (feature branch)     -> STAGING_DATABASE_URL  (water_tracker_staging, demo data)
#
# The URLs come from .env (see .env.example). Compose reads .env only to fill in ${...} below;
# nothing else from it is passed into the containers, so staging never sees live's URL.
#
# Phone access: add your LAN/Tailscale address in docker-compose.override.yml (gitignored,
# see README). Compose merges it automatically.
#
# Deploy with scripts/deploy.ps1 live|staging — it builds the image, runs migrations against that
# target's database, recreates the container, and probes /api/health. A file edit is not a deploy
# until that script runs. GIT_SHA is set by the deploy script so /api/health can report it.
#
# Binding order matters if you add a second address in the override: keep 127.0.0.1 first.
# Docker aborts all bindings if the first one fails, and a VPN address can be late at boot.

services:
  live:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: water-tracker:live
    container_name: water-tracker
    environment:
      - PORT=4210
      - DATABASE_URL=${LIVE_DATABASE_URL:?set LIVE_DATABASE_URL in .env}
    networks:
      - lifeos
    ports:
      - "127.0.0.1:4210:4210"
    restart: unless-stopped

  staging:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: water-tracker:staging
    container_name: water-tracker-staging
    environment:
      - PORT=4211
      # Its own database with demo data (scripts/seed-demo.ts), never live's.
      - DATABASE_URL=${STAGING_DATABASE_URL:?set STAGING_DATABASE_URL in .env}
    networks:
      - lifeos
    ports:
      - "127.0.0.1:4211:4211"
    restart: unless-stopped

networks:
  lifeos:
    name: lifeos-network
    external: true
